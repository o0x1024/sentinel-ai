<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Business Service</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --panel-soft: #eef3ff;
        --line: #d9e1f2;
        --text: #1f2937;
        --muted: #667085;
        --accent: #2563eb;
        --accent-soft: #dbeafe;
        --danger: #dc2626;
        --success: #059669;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
        background:
          radial-gradient(circle at top left, #dbeafe 0%, transparent 35%),
          linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
        color: var(--text);
      }

      .page {
        max-width: 1440px;
        margin: 0 auto;
        padding: 28px;
      }

      .hero {
        margin-bottom: 18px;
      }

      .hero h1 {
        margin: 0;
        font-size: 34px;
        line-height: 1.15;
      }

      .hero p {
        margin: 10px 0 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .layout {
        display: grid;
        grid-template-columns: 360px minmax(0, 1fr);
        gap: 18px;
        align-items: start;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 14px 40px rgba(37, 99, 235, 0.06);
      }

      .panel-header {
        padding: 18px 20px 12px;
        border-bottom: 1px solid #edf2fe;
      }

      .panel-header h2,
      .panel-header h3 {
        margin: 0;
        font-size: 18px;
      }

      .panel-header p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .panel-body {
        padding: 18px 20px 20px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 14px;
      }

      .field label {
        font-size: 13px;
        color: var(--muted);
      }

      select,
      input,
      textarea,
      button {
        font: inherit;
      }

      select,
      input,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        background: #fff;
        color: var(--text);
      }

      textarea {
        min-height: 96px;
        resize: vertical;
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      button {
        border: 0;
        border-radius: 12px;
        padding: 10px 14px;
        cursor: pointer;
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 600;
      }

      button.primary {
        background: var(--accent);
        color: #fff;
      }

      button.ghost {
        background: #f8fafc;
        color: var(--text);
        border: 1px solid var(--line);
      }

      .scenario-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .scenario-card {
        border: 1px solid var(--line);
        border-radius: 16px;
        background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
        padding: 16px;
      }

      .scenario-card h4 {
        margin: 0 0 8px;
        font-size: 16px;
      }

      .scenario-card p {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
        min-height: 62px;
      }

      .badge-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 12px;
        font-weight: 700;
      }

      .badge-risk {
        background: #fee2e2;
        color: var(--danger);
      }

      .badge-method {
        background: #dcfce7;
        color: var(--success);
      }

      .console {
        background: #0f172a;
        color: #e2e8f0;
        border-radius: 16px;
        padding: 16px;
        min-height: 260px;
        overflow: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        line-height: 1.65;
        white-space: pre-wrap;
      }

      .request-log {
        border-top: 1px dashed var(--line);
        margin-top: 14px;
        padding-top: 14px;
      }

      .request-log h4 {
        margin: 0 0 10px;
        font-size: 14px;
      }

      .tiny {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
      }

      @media (max-width: 1080px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .scenario-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="hero">
        <h1>Demo Business Service</h1>
        <p>
          用于给当前 System Agent 制造真实业务流量。你可以直接在这里切换身份、点击场景按钮，
          通过浏览器和代理快速生成对象越权、审批越权、重复兑换、跳步执行和重复支付流量。
        </p>
      </div>

      <div class="layout">
        <section class="panel">
          <div class="panel-header">
            <h2>测试控制台</h2>
            <p>先选择身份，再执行单个场景，或者一键跑一轮混合流量。</p>
          </div>
          <div class="panel-body">
            <div class="field">
              <label for="demo-user">当前身份</label>
              <select id="demo-user">
                <option value="alice">alice / tenant-a / user</option>
                <option value="bob">bob / tenant-b / user</option>
                <option value="admin">admin / tenant-a / admin</option>
                <option value="finance">finance / tenant-a / finance</option>
              </select>
            </div>

            <div class="field">
              <label for="base-url">服务地址</label>
              <input id="base-url" value="" />
            </div>

            <div class="button-row">
              <button class="primary" id="run-all">运行一轮完整场景</button>
              <button class="ghost" id="load-state">查看当前状态</button>
              <button class="ghost" id="clear-console">清空输出</button>
            </div>

            <div class="request-log">
              <h4>最近响应</h4>
              <div class="console" id="console"></div>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h3>场景列表</h3>
            <p>建议让 Sentinel 代理监听器保持开启，再通过浏览器访问此页面并点击下面按钮。</p>
          </div>
          <div class="panel-body">
            <div class="scenario-grid" id="scenario-grid"></div>
            <p class="tiny" style="margin-top: 14px;">
              提示：如果要更稳定地触发当前 `traffic_logic_triage`，建议混合不同身份访问同类资源，再重复执行审批、兑换和支付类动作。
            </p>
          </div>
        </section>
      </div>
    </div>

    <script>
      const baseUrlInput = document.getElementById('base-url');
      const userSelect = document.getElementById('demo-user');
      const consoleEl = document.getElementById('console');
      const scenarioGrid = document.getElementById('scenario-grid');

      const inferredBaseUrl = window.location.origin === 'null'
        ? 'http://127.0.0.1:7788'
        : window.location.origin;
      baseUrlInput.value = inferredBaseUrl;

      const scenarios = [
        {
          id: 'idor-order',
          title: '对象越权：跨租户订单',
          risk: 'IDOR / 越权读取',
          method: 'GET',
          description: '使用当前身份访问不属于自己的订单，观察是否直接返回完整订单内容。',
          run: ({ baseUrl, user }) => requestJson(baseUrl, '/api/orders/ord-2001', { method: 'GET', user }),
        },
        {
          id: 'idor-project-members',
          title: '对象越权：项目成员列表',
          risk: 'IDOR / 越权读取',
          method: 'GET',
          description: '读取其他租户项目的成员列表，制造跨项目成员信息泄露流量。',
          run: ({ baseUrl, user }) => requestJson(baseUrl, '/api/projects/proj-200/members', { method: 'GET', user }),
        },
        {
          id: 'approval-bypass',
          title: '审批越权',
          risk: '业务逻辑 / 审批绕过',
          method: 'POST',
          description: '使用普通用户直接审批订单，验证服务端是否做了角色和租户校验。',
          run: ({ baseUrl, user }) => requestJson(baseUrl, '/api/orders/ord-2001/approve', { method: 'POST', user }),
        },
        {
          id: 'double-redeem',
          title: '重复兑换',
          risk: '业务逻辑 / 重放',
          method: 'POST',
          description: '连续两次兑换同一张优惠券，测试是否缺少单次使用控制。',
          run: async ({ baseUrl, user }) => {
            const first = await requestJson(baseUrl, '/api/coupons/redeem', {
              method: 'POST',
              user,
              body: { couponCode: 'WELCOME-50', orderId: 'ord-1001' },
            });
            const second = await requestJson(baseUrl, '/api/coupons/redeem', {
              method: 'POST',
              user,
              body: { couponCode: 'WELCOME-50', orderId: 'ord-1001' },
            });
            return { first, second };
          },
        },
        {
          id: 'skip-step',
          title: '跳步执行',
          risk: '业务逻辑 / 流程绕过',
          method: 'POST',
          description: '不调用 prepare，直接 confirm，验证确认动作是否依赖前置状态。',
          run: ({ baseUrl, user }) => requestJson(baseUrl, '/api/transfers/confirm', {
            method: 'POST',
            user,
            body: { transferId: 'tr-missing', amount: 100, toAccount: 'merchant-main' },
          }),
        },
        {
          id: 'double-pay',
          title: '重复支付',
          risk: '业务逻辑 / 幂等性缺失',
          method: 'POST',
          description: '对同一张发票连续支付，观察 paidCount 是否不断增加。',
          run: async ({ baseUrl, user }) => {
            const first = await requestJson(baseUrl, '/api/invoices/inv-100/pay', { method: 'POST', user });
            const second = await requestJson(baseUrl, '/api/invoices/inv-100/pay', { method: 'POST', user });
            return { first, second };
          },
        },
      ];

      function appendLog(title, payload) {
        const block = [
          `# ${new Date().toLocaleTimeString()} ${title}`,
          typeof payload === 'string' ? payload : JSON.stringify(payload, null, 2),
          '',
        ].join('\n');
        consoleEl.textContent = `${block}${consoleEl.textContent}`;
      }

      async function requestJson(baseUrl, path, { method, user, body }) {
        const response = await fetch(`${baseUrl}${path}`, {
          method,
          headers: {
            'content-type': body ? 'application/json' : 'text/plain',
            authorization: `Bearer demo-${user}`,
            'x-demo-user': user,
          },
          body: body ? JSON.stringify(body) : undefined,
        });
        const data = await response.json();
        return {
          status: response.status,
          path,
          method,
          actor: user,
          data,
        };
      }

      async function runScenario(scenario) {
        const baseUrl = baseUrlInput.value.trim() || inferredBaseUrl;
        const user = userSelect.value;
        appendLog(`开始执行 ${scenario.title}`, { baseUrl, user, scenario: scenario.id });
        try {
          const result = await scenario.run({ baseUrl, user });
          appendLog(`完成 ${scenario.title}`, result);
        } catch (error) {
          appendLog(`失败 ${scenario.title}`, { message: error instanceof Error ? error.message : String(error) });
        }
      }

      function renderScenarioCard(scenario) {
        const card = document.createElement('div');
        card.className = 'scenario-card';
        card.innerHTML = `
          <div class="badge-row">
            <span class="badge badge-risk">${scenario.risk}</span>
            <span class="badge badge-method">${scenario.method}</span>
          </div>
          <h4>${scenario.title}</h4>
          <p>${scenario.description}</p>
        `;
        const button = document.createElement('button');
        button.className = 'primary';
        button.textContent = '执行场景';
        button.addEventListener('click', () => void runScenario(scenario));
        card.appendChild(button);
        scenarioGrid.appendChild(card);
      }

      scenarios.forEach(renderScenarioCard);

      document.getElementById('clear-console').addEventListener('click', () => {
        consoleEl.textContent = '';
      });

      document.getElementById('load-state').addEventListener('click', async () => {
        const baseUrl = baseUrlInput.value.trim() || inferredBaseUrl;
        const user = userSelect.value;
        try {
          const state = await requestJson(baseUrl, '/api/demo/state', { method: 'GET', user });
          appendLog('当前内存状态', state);
        } catch (error) {
          appendLog('查看当前状态失败', { message: error instanceof Error ? error.message : String(error) });
        }
      });

      document.getElementById('run-all').addEventListener('click', async () => {
        for (const scenario of scenarios) {
          // 串行执行，方便历史记录和 triage 看出流程关系。
          // eslint-disable-next-line no-await-in-loop
          await runScenario(scenario);
        }
      });

      appendLog('服务就绪', {
        baseUrl: inferredBaseUrl,
        currentUser: userSelect.value,
        tip: '切换身份后点击场景按钮，即可通过浏览器直接制造测试流量。',
      });
    </script>
  </body>
</html>
