[package]
name = "sentinel-tools"
version = "0.1.0"
edition = "2021"

[lib]
name = "sentinel_tools"
path = "src/lib.rs"

[features]
default = ["db-sqlite", "plugins", "ocr"]
db = ["dep:sentinel-db"]
plugins = ["dep:sentinel-plugins"]
ocr = ["dep:oar-ocr"]
db-sqlite = [
    "db",
    "sentinel-core/db-sqlite",
    "sentinel-db?/db-sqlite",
    "sentinel-plugins?/db-sqlite",
]
db-postgres = [
    "db",
    "sentinel-core/db-postgres",
    "sentinel-db?/db-postgres",
    "sentinel-plugins?/db-postgres",
]
db-mysql = [
    "db",
    "sentinel-core/db-mysql",
    "sentinel-db?/db-mysql",
    "sentinel-plugins?/db-mysql",
]

[dependencies]
sentinel-core = { path = "../sentinel-core", default-features = false }
sentinel-db = { path = "../sentinel-db", default-features = false, optional = true }
sentinel-plugins = { path = "../sentinel-plugins", default-features = false, optional = true }
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
tauri = "2.7.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
cron = "0.15"
rmcp = { workspace = true }
reqwest = { version = "0.12.0", features = ["json", "socks"] }
futures = "0.3"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["net"] }
regex = "1"
once_cell = "1.19"
thiserror = "1.0"
base64 = "0.22"
sha2 = "0.10"
dirs = "5.0"
toml = "0.8"
glob = "0.3"
walkdir = "2.5"
csv = "1.3"
ipnet = "2"
pnet = "0.35"

# rig-core for Tool trait
rig-core = { workspace = true }
schemars = "1.1.0"
rsubdomain = "1.2.14"
jsonschema = "0.17.1"
oar-ocr = { version = "0.5.0", optional = true }

# WebSocket for interactive terminal
tokio-tungstenite = "0.28.0"
bytes = "1.8"

# PTY for better terminal support
portable-pty = "0.9.0"
