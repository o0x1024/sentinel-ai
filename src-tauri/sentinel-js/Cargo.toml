[package]
name = "sentinel-js"
version = "0.1.0"
edition = "2021"
description = "Embedded JavaScript plugin runtime for Sentinel, built on QuickJS-NG"
authors = ["Sentinel Team"]

[features]
default = ["full"]
full = ["node-compat", "web-apis"]
node-compat = []
web-apis = []

[dependencies]
# QuickJS-NG via rquickjs — will be vendored/forked later for deeper customization
rquickjs = { version = "0.11", features = [
    "classes",
    "properties",
    "parallel",
    "loader",
    "futures",
    "macro",
    "array-buffer",
] }

# Crypto for crypto.subtle and Node crypto
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hmac = "0.12"
digest = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }

# Base64
base64 = "0.22"

# URL parsing
url = "2"

# Async runtime bridge
tokio = { version = "1", features = ["rt", "sync", "time"] }

# HTTP client (for fetch builtin)
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
log = "0.4"
tracing = "0.1"

# Error handling
anyhow = "1.0"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
