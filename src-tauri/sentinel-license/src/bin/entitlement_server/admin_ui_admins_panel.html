        <section class="card panel-body view-panel" data-section-panel="admins" hidden>
          <div class="section-head">
            <div>
              <div class="eyebrow">Admins</div>
              <h2>管理员账号</h2>
            </div>
            <div class="toolbar">
              <span id="adminDirtyPill" class="pill warn" hidden>未保存修改</span>
              <button class="secondary" id="refreshAdminsBtn">刷新管理员</button>
            </div>
          </div>

          <div class="grid-3 stack-14">
            <div>
              <label class="muted">Admin ID</label>
              <input id="adminId" placeholder="ops-admin" />
              <div id="adminIdError" class="field-error"></div>
            </div>
            <div>
              <label class="muted">Role</label>
              <select id="adminRole">
                <option value="admin">admin</option>
                <option value="operator">operator</option>
                <option value="viewer">viewer</option>
              </select>
            </div>
            <div>
              <label class="muted">Active</label>
              <select id="adminActive">
                <option value="true">true</option>
                <option value="false">false</option>
              </select>
            </div>
          </div>

          <div class="stack-14">
            <label class="muted">Admin API Key</label>
            <input id="adminApiKey" type="password" placeholder="创建时必填，更新时留空表示不轮换" />
            <div id="adminApiKeyError" class="field-error"></div>
          </div>

          <div class="toolbar section-toolbar">
            <button id="saveAdminBtn">创建 / 更新管理员</button>
          </div>

          <div id="adminStatus" class="status-box">管理员表单就绪。</div>

          <div class="list admin-list" id="adminList"></div>
        </section>
