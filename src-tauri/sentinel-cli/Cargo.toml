[package]
name = "sentinel-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sentinel-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
libc = "0.2"
reqwest = { version = "0.12", features = ["cookies", "json", "rustls-tls"] }
rig-core = { version = "0.35.0", default-features = false, features = ["derive", "reqwest", "native-tls"] }
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sentinel-llm = { path = "../sentinel-llm" }
sentinel-tools = { path = "../sentinel-tools", default-features = false }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
